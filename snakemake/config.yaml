# Input data
flowcell1_dir: "/data/groups/wheelenj/sequencing/20250916_M009242/4650P/Planaria1/20250909_1219_3B_PBE82635_fbdcc6f4/fastq_pass"
flowcell2_dir: "/data/groups/wheelenj/sequencing/20250916_M009242/4651P/Planaria2/20250909_1354_3C_PBE69031_20f7cd5b/fastq_pass"
input_reads: "reads/planaria_all_reads.fastq.gz"

# Genome parameters
genome_size: "1g"

filtlong:
  min_length: 1000
  keep_percent: 80
  # target_bases: 120000000000
  min_mean_q: 8

flye:
  iterations: 2
  asm-coverage: 80
  
medaka:
  model: "r1041_e82_400bps_sup_g615" 
  batch_size: 100

racon:
  rounds: 3

purge_dups:
  # Manual read-depth cutoffs for calcuts; set all to null to let calcuts pick.
  # Check results/final/purge_dups/PB.cov.png before changing.
  cutoffs:
    lower: 5
    mid: 86
    upper: 306

busco:
  lineage: "metazoa_odb10"

threads:
  flye: 48
  medaka: 64
  racon: 64
  busco: 32
  purge_dups: 32
  seqkit: 32

mito:
  # Published Girardia mitogenomes used to find, orient and check ours
  # (G. tigrina; Girardia sp. ER-2015)
  references: ["MW972220.1", "KP090061.1"]
  # Nuclear Flye contigs at or above this depth are searched for the mitogenome
  seed_min_depth: 300
  # Reads must be this mitochondrial (aligned fraction) and this long
  min_aligned_frac: 0.8
  min_read_length: 3000
  # Longest/best reads up to ~250x of a 16 kb genome
  target_bases: 4000000
  genome_size: "16k"
  # Plausible length range for the circular contig
  min_length: 12000
  max_length: 30000
  medaka_model: "r1041_e82_400bps_sup_v4.3.0"
  genetic_code: 9   # echinoderm and flatworm mitochondrial code
  mitos_refseq: "refseq89m"
  seq_name: "Gdor_MA-C2_mito"
