executor: cluster-generic
cluster-generic-submit-cmd:
  mkdir -p logs/{rule} &&
  sbatch
    --partition={resources.partition}
    --cpus-per-task={threads}
    --mem={resources.mem_mb}
    --job-name=smk-{rule}-{wildcards}
    --output=logs/{rule}/{rule}-{wildcards}-%j.out
    --parsable
    --gpus={resources.gpus}
default-resources:
  - partition=week
  - mem_mb=200000
  - gpus=0
set-resources:
    initial_qc:
      partition: week
      mem_mb: 32000

    filtlong:
      partition: week
      mem_mb: 64000

    filtered_qc:
      partition: week
      mem_mb: 64000

    flye_assembly:
      partition: week
      mem_mb: 200000

    busco_initial:
      partition: week
      mem_mb: 64000

    medaka_polish:
      partition: GPU
      gpus: 1
      mem_mb: 128000

    busco_medaka:
      partition: week
      mem_mb: 64000

    racon_round:
      partition: week
      mem_mb: 128000

    racon_final:
      partition: week
      mem_mb: 128000

    busco_racon:
      partition: week
      mem_mb: 64000

    purge_dups:
      partition: week
      mem_mb: 64000

    busco_final:
      partition: week
      mem_mb: 64000

    busco_plot:
      partition: week
      mem_mb: 64000
restart-times: 1
max-jobs-per-second: 10
max-status-checks-per-second: 1
local-cores: 1
latency-wait: 60
jobs: 500
keep-going: True
rerun-incomplete: True
keep-incomplete: True
printshellcmds: True
scheduler: greedy
use-conda: True
